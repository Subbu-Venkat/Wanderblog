
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wanderblog-eks-cluster
  region: ap-south-1
  version: "1.35"
  tags:
    owner: gauri-shirkande
    bu: cwg
    project: wanderblog

availabilityZones:
  - ap-south-1a
  - ap-south-1b

iam:
  withOIDC: true

managedNodeGroups:
  - name: wanderblog-node-group
    instanceType: t3.medium

    # Explicit node count
    desiredCapacity: 2
    minSize: 2
    maxSize: 2

    # Worker nodes in private subnets
    privateNetworking: true

    volumeSize: 20
    volumeType: gp3

    labels:
      lifecycle: ec2-autoscaler
      project: wanderblog

    tags:
      project: wanderblog
      owner: gauri-shirkande

    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        certManager: true
        externalDNS: false
        albIngress: true
        cloudWatch: true
